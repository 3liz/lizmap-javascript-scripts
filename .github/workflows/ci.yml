name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Verifier les traductions
        run: npm run check:i18n
      - name: Verifier le catalogue
        run: npm run check:catalog
